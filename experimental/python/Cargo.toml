[package]
name = "foldlitedb-experimental-python"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
foldlitedb-engine = { path = "../engine" }
pyo3 = { version = "=0.27.2", features = ["extension-module"] }
serde_json = "=1.0.145"

[build-dependencies]
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = "thin"
