[package]
name = "foldlitedb-engine"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
foldlitedb-reducer = { path = "../../reducers/core" }
fs2 = "=0.4.3"
rayon = "=1.11.0"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
uuid = { version = "=1.18.1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
