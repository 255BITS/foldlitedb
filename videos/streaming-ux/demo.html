<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Foldlite DB • Live operations</title>
  <style>
    @font-face {
      font-family: Open;
      src: url("/fonts/OpenSans-Regular.ttf");
    }
    @font-face {
      font-family: Open;
      src: url("/fonts/OpenSans-Bold.ttf");
      font-weight: 700;
    }
    @font-face {
      font-family: Code;
      src: url("/fonts/SourceCodePro-Regular.otf");
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #101c2b;
      color: #eaf0f6;
      font:
        18px Open,
        sans-serif;
    }
    header {
      height: 88px;
      border-bottom: 1px solid #2b3c50;
      display: flex;
      align-items: center;
      padding: 0 42px;
      gap: 20px;
    }
    .brand {
      font-weight: 700;
      font-size: 24px;
    }
    .tag {
      font:
        13px Code,
        monospace;
      color: #8eacc2;
      letter-spacing: 2px;
    }
    .right {
      margin-left: auto;
      display: flex;
      gap: 18px;
      align-items: center;
    }
    button {
      background: #192e40;
      border: 1px solid #426079;
      border-radius: 8px;
      padding: 11px 18px;
      color: #eaf0f6;
      font: 15px Open;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 3px solid #54e4c4;
      outline-offset: 3px;
    }
    #status {
      color: #54e4c4;
      font: 14px Code;
    }
    .paused #status {
      color: #ffc67b;
    }
    main {
      padding: 30px 42px;
    }
    .eyebrow {
      color: #7e9bb3;
      font: 12px Code;
      letter-spacing: 2px;
    }
    .top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    h1 {
      font-size: 29px;
      margin: 8px 0 0;
    }
    #count {
      font: 14px Code;
      color: #9ab2c9;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
    }
    .card {
      border: 1px solid #31485e;
      border-radius: 13px;
      padding: 20px 24px;
      background: #142334;
      transition:
        background 0.4s,
        border-color 0.4s;
    }
    .card.changed {
      animation: flash 0.8s;
    }
    .name {
      font-size: 15px;
      color: #a6bfd0;
      display: flex;
      justify-content: space-between;
    }
    .mean {
      font-size: 53px;
      font-weight: 700;
      letter-spacing: -2px;
      color: #f4fafc;
      line-height: 1.3;
    }
    .unit {
      font-size: 19px;
      color: #7e9bb3;
      letter-spacing: 0;
      margin-left: 8px;
    }
    .bar {
      height: 5px;
      background: #253b50;
      border-radius: 8px;
      margin: 12px 0 15px;
    }
    .fill {
      height: 100%;
      background: #54e4c4;
      border-radius: 8px;
      max-width: 100%;
    }
    .details {
      font: 13px Code;
      color: #8faac1;
      display: flex;
      justify-content: space-between;
    }
    .bottom {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      align-items: center;
      color: #8faac1;
      font: 13px Code;
    }
    .pill {
      border: 1px solid #345467;
      padding: 7px 12px;
      border-radius: 20px;
      color: #54e4c4;
    }
    #activity {
      margin-left: auto;
      color: #b4c8d9;
    }
    @keyframes flash {
      from {
        background: #1e534e;
        border-color: #54e4c4;
      }
      to {
        background: #142334;
        border-color: #31485e;
      }
    }
    #error {
      color: #ff9b9b;
    }
  </style>
  <header>
    <div class="brand">foldlite<span style="color: #54e4c4">db</span></div>
    <span class="tag">/ LIVE OPERATIONS</span>
    <div class="right">
      <span id="status" role="status">● CONNECTING</span
      ><button id="publish">New observation</button
      ><button id="connection">Pause connection</button>
    </div>
  </header>
  <main>
    <div class="top">
      <div>
        <div class="eyebrow">SAME PAGE · INCREMENTAL VIEWS</div>
        <h1>Your operations, in motion.</h1>
      </div>
      <div id="count">Loading observations…</div>
    </div>
    <section
      class="grid"
      id="cards"
      aria-label="Live metric summaries"
    ></section>
    <div class="bottom">
      <span class="pill">WASM WORKER</span
      ><span class="pill">SSE DOCUMENT STREAM</span><span id="cursor"></span
      ><span id="activity" role="status">Bootstrapping…</span>
    </div>
    <p id="error" role="alert"></p>
  </main>
  <script type="module">
    import { BrowserDatabase } from "/portable/client.js";
    const demo = (window.demo = {
      ready: false,
      cursor: 0,
      paused: false,
      db: null,
    });
    let source,
      viewCursor,
      applied = Promise.resolve(),
      reconnectTimer;
    const units = { latency: "ms", checkout: "ms", worker: "%" };
    const names = {
      latency: "Request latency",
      checkout: "Checkout duration",
      worker: "Worker utilization",
    };
    const format = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(1));
    function render(rows) {
      for (const row of rows) {
        // The fixture has only these three known keys. textContent owns data values.
        if (!Object.hasOwn(names, row.key))
          throw new Error("Unexpected metric");
        let card = document.querySelector(`[data-key="${row.key}"]`);
        if (!card) {
          card = document.createElement("article");
          card.className = "card";
          card.dataset.key = row.key;
          card.innerHTML =
            '<div class="name"></div><div><span class="mean"></span><span class="unit"></span></div><div class="bar"><div class="fill"></div></div><div class="details"><span class="samples"></span><span class="range"></span></div>';
          document.querySelector("#cards").append(card);
        }
        card.querySelector(".name").textContent = names[row.key];
        card.querySelector(".mean").textContent = format(row.result.mean);
        card.querySelector(".unit").textContent = units[row.key];
        card.querySelector(".samples").textContent =
          `${row.result.count} observations`;
        card.querySelector(".range").textContent =
          `${row.result.min}–${row.result.max}`;
        card.querySelector(".fill").style.width =
          `${Math.min(100, row.result.mean)}%`;
        card.classList.remove("changed");
        void card.offsetWidth;
        card.classList.add("changed");
      }
    }
    function cursorLabel() {
      document.querySelector("#cursor").textContent =
        `applied document cursor: ${demo.cursor}`;
      document.querySelector("#count").textContent =
        `${demo.cursor} observations · 3 live groups`;
    }
    function failed(error) {
      source?.close();
      demo.paused = true;
      clearTimeout(reconnectTimer);
      document.querySelector("#error").textContent = error.message;
      document.querySelector("#status").textContent = "● ERROR";
    }
    function connect() {
      source?.close();
      source = new EventSource(`/events?after=${demo.cursor}`);
      source.onopen = () => {
        document.querySelector("#status").textContent = "● LIVE";
      };
      source.addEventListener("frame", (event) => {
        applied = applied
          .then(async () => {
            const frame = JSON.parse(event.data);
            if (frame.cursor <= demo.cursor) return;
            if (frame.cursor !== demo.cursor + 1)
              throw new Error("Document gap: bootstrap required");
            await demo.db.ingest([frame.document]);
            let changes;
            do {
              changes = await demo.db.changes(viewCursor, { limit: 1 });
              render(changes.rows);
              viewCursor = changes.cursor;
            } while (!changes.complete);
            // Acknowledge only after ingestion and all keyed UI replacements succeed.
            demo.cursor = frame.cursor;
            cursorLabel();
            document.querySelector("#activity").textContent =
              `Updated ${names[frame.document.payload.metric].toLowerCase()}`;
          })
          .catch(failed);
      });
      source.onerror = () => {
        source.close();
        if (!demo.paused) {
          document.querySelector("#status").textContent = "● RECONNECTING";
          reconnectTimer = setTimeout(connect, 1000);
        }
      };
    }
    document.querySelector("#connection").onclick = async () => {
      if (!demo.ready) return;
      demo.paused = !demo.paused;
      document.body.classList.toggle("paused", demo.paused);
      document.querySelector("#connection").textContent = demo.paused
        ? "Reconnect"
        : "Pause connection";
      if (demo.paused) {
        clearTimeout(reconnectTimer);
        source?.close();
        await applied;
        document.querySelector("#status").textContent = "● DISCONNECTED";
        document.querySelector("#activity").textContent =
          "Current view retained · new facts wait on the server";
      } else connect();
    };
    document.querySelector("#publish").onclick = () =>
      fetch("/publish", { method: "POST" });
    try {
      demo.db = await BrowserDatabase.connect({
        base: "/portable/",
        name: "metrics",
      });
      const bootstrap = await (await fetch("/bootstrap")).json();
      await demo.db.ingest(bootstrap.documents);
      let snapshot = await demo.db.query({ limit: 1 });
      for (;;) {
        render(snapshot.rows);
        if (snapshot.complete) break;
        snapshot = await demo.db.query({
          limit: 1,
          cursor: snapshot.cursor,
          after: snapshot.after,
        });
      }
      viewCursor = snapshot.cursor;
      demo.cursor = bootstrap.cursor;
      cursorLabel();
      document.querySelector("#activity").textContent =
        "Consistent snapshot applied · following new observations";
      demo.ready = true;
      connect();
    } catch (error) {
      failed(error);
    }
  </script>
</html>
