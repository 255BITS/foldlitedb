[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foldlitedb"
version = "0.1.0"
description = "Embedded realtime views over immutable documents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
reducers = ["wasmtime>=48,<49"]
test = ["pytest>=8,<10"]
browser = ["playwright>=1.58,<2"]
dev = ["build>=1,<2", "pytest>=8,<10", "wasmtime>=48,<49"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["foldlitedb", "foldlitedb.*"]
namespaces = false

[tool.setuptools.package-data]
"foldlitedb.reducers" = ["assets/*.wasm", "assets/*.json", "assets/*.js", "assets/*.html", "assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
markers = ["browser: requires a real Chromium browser"]
