[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "foldlitedb"
version = "0.1.0"
description = "Immutable document logs and rebuildable views with Rust and portable WebAssembly."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/255BITS/foldlitedb"
Documentation = "https://255bits.github.io/foldlitedb/"
Issues = "https://github.com/255BITS/foldlitedb/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
browser = ["playwright>=1.58,<2"]
dev = ["build>=1,<2", "maturin>=1.9,<2", "pytest>=8,<10"]

[tool.maturin]
manifest-path = "native/python/Cargo.toml"
python-source = "src"
module-name = "foldlitedb._native"
bindings = "pyo3"
include = [
    { path = "README.md", format = "sdist" },
    { path = "DESIGN.md", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
    { path = "native/licenses/**/*", format = "sdist" },
    { path = "views/**/*", format = "sdist" },
    { path = "scripts/*.py", format = "sdist" },
    { path = "tests/**/*", format = "sdist" },
    { path = "examples/**/*", format = "sdist" },
    { path = "docs/**/*", format = "sdist" },
]
exclude = ["**/node_modules/**", "**/target/**", "**/.build/**", "**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["browser"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
markers = ["browser: requires a real Chromium browser"]
