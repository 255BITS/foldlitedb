[package]
name = "foldlitedb-reducer-wasm"
version = "0.3.3"
edition = "2021"
rust-version = "1.90"
description = "Sandboxed WebAssembly numeric and envelope reducers for Foldlite DB"
license = "MIT"
repository = "https://github.com/255BITS/foldlitedb"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
