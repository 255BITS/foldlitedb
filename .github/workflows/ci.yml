name: Foldlite DB

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - name: Install built wheel
        run: python -c "import pathlib,subprocess,sys; wheel=next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install',str(wheel)+'[reducers,test]'])"
      - name: Verify installed package
        working-directory: ${{ runner.temp }}
        run: python -I -m pytest "${{ github.workspace }}/tests" --import-mode=importlib
      - name: Verify source distribution rebuild
        run: python -c "import pathlib,subprocess,sys; source=next(pathlib.Path('dist').glob('*.tar.gz')); subprocess.check_call([sys.executable,'-m','pip','wheel','--no-deps','--wheel-dir','rebuilt',str(source)])"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify native Rust core
        working-directory: reducers/core
        run: cargo test --locked
      - name: Verify reproducible WASM build
        run: python scripts/build_reducer.py --check
      - name: Verify native and WASM behavior
        run: |
          python -m pip install '.[reducers]'
          python scripts/check_reducer_parity.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[reducers,test,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/browser
