name: Native Python wheels

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable source commit validated by the release workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify native engine and portable views
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - run: npm ci --prefix views
      - name: Verify bundled view modules and SDK behavior
        run: |
          npm run check --prefix views
          npm test --prefix views
      - name: Verify native storage and third-party notices
        run: |
          cargo test --locked --manifest-path native/Cargo.toml -p foldlitedb-portable-engine
          python scripts/build_native_notices.py --check
      - run: python -m pip install '.[dev,browser]'
      - run: python -m playwright install --with-deps chromium
      - name: Verify Python API and native/browser parity
        run: |
          python -m pytest tests
          python -m pytest tests/browser
      - name: Verify replay and documentation examples
        run: |
          python scripts/benchmark_database.py --documents 256 --batch-size 64 --live-documents 8 --output native-benchmark-smoke.json
          python scripts/build_docs.py
          python scripts/check_docs.py --execute --browser

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-14
            target: aarch64
          - os: macos-15-intel
            target: x86_64
          - os: windows-latest
            target: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build portable abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist
          manylinux: "2014"
          rust-toolchain: "1.90.0"
      - name: Install and exercise packaged native engine
        shell: bash
        run: |
          python -m pip install --no-index --no-deps --only-binary=:all: --find-links dist foldlitedb
          python -m pip install 'pytest>=8,<10'
          python -I examples/portable_metrics.py
      - name: Test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -I -m pytest "${{ github.workspace }}/tests" --import-mode=importlib
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: python -m pip install 'maturin>=1.9,<2' 'pytest>=8,<10'
      - run: maturin sdist --manifest-path native/python/Cargo.toml --out dist
      - name: Rebuild and install from the source archive
        run: python -c "import pathlib,subprocess,sys; source=next(pathlib.Path('dist').glob('*.tar.gz')); subprocess.check_call([sys.executable,'-m','pip','wheel','--no-deps','--wheel-dir','rebuilt','--config-settings','build-args=--locked',str(source)]); wheel=next(pathlib.Path('rebuilt').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--no-deps',str(wheel)])"
      - name: Test rebuilt source archive outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -I -m pytest "${{ github.workspace }}/tests" --import-mode=importlib
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error

  distributions:
    name: Collect tested release distributions
    needs: [verify, wheels, source]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: dist
      - run: python -m pip install 'twine>=6,<7'
      - name: Validate package metadata and README
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
